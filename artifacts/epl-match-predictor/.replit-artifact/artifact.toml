kind = "web"
previewPath = "/"
title = "EPL Match Predictor"
description = "A responsive Premier League match prediction dashboard with team selection, illustrative demo probabilities, recent predictions, and light/dark themes."
version = "1.0.0"
id = "artifacts/epl-match-predictor"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24809

[services.development]
run = "pnpm --filter @workspace/epl-match-predictor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/epl-match-predictor", "run", "build" ]
serve = "static"
publicDir = "artifacts/epl-match-predictor/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24809"
BASE_PATH = "/"
